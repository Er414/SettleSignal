<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SettleSignal atmospheric settlement ring</title>
  <desc id="desc">An abstract luminous glass ring and fine signal paths on a deep charcoal background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b24"/><stop offset=".52" stop-color="#07090c"/><stop offset="1" stop-color="#121911"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#d6f25c" stop-opacity=".22"/><stop offset=".55" stop-color="#8ecfff" stop-opacity=".10"/><stop offset="1" stop-color="#07090c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f1ea" stop-opacity=".95"/><stop offset=".24" stop-color="#8ecfff" stop-opacity=".75"/><stop offset=".52" stop-color="#d6f25c" stop-opacity=".92"/><stop offset=".78" stop-color="#8ecfff" stop-opacity=".5"/><stop offset="1" stop-color="#f4f1ea" stop-opacity=".92"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g opacity=".18" stroke="#e9f0ec" stroke-width="1">
    <path d="M0 170H1600M0 280H1600M0 390H1600M0 500H1600M0 610H1600M0 720H1600"/>
    <path d="M160 0V900M320 0V900M480 0V900M640 0V900M800 0V900M960 0V900M1120 0V900M1280 0V900M1440 0V900"/>
  </g>
  <ellipse cx="800" cy="445" rx="265" ry="220" fill="#d6f25c" opacity=".13" filter="url(#blur)"/>
  <g transform="translate(800 435) rotate(-19)">
    <ellipse rx="235" ry="166" fill="none" stroke="#8ecfff" stroke-width="42" opacity=".18" filter="url(#soft)"/>
    <ellipse rx="235" ry="166" fill="none" stroke="url(#ring)" stroke-width="25"/>
    <ellipse rx="235" ry="166" fill="none" stroke="#f4f1ea" stroke-opacity=".72" stroke-width="2"/>
    <ellipse rx="188" ry="127" fill="none" stroke="#8ecfff" stroke-opacity=".6" stroke-width="2" stroke-dasharray="2 14"/>
    <path d="M-320 0C-195 -128 -70 134 70 -4S270 -130 340 3" fill="none" stroke="#d6f25c" stroke-width="2.5" stroke-opacity=".8"/>
    <circle cx="-234" cy="-2" r="8" fill="#d6f25c"/><circle cx="72" cy="-4" r="6" fill="#f4f1ea"/><circle cx="338" cy="2" r="8" fill="#8ecfff"/>
  </g>
  <g fill="#f4f1ea" font-family="monospace" letter-spacing="4">
    <text x="72" y="88" font-size="17" opacity=".82">SETTLESIGNAL / SIGNAL STILL</text>
    <text x="72" y="830" font-size="14" opacity=".58">CONCEPTUAL VISUAL · NOT A LIVE TRANSACTION</text>
    <text x="1528" y="830" font-size="14" opacity=".58" text-anchor="end">ARC / USDC</text>
  </g>
</svg>